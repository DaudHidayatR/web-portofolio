name: OpenSSF Scorecard Experiment

on:
  push:
    branches: [main]
  schedule:
    - cron: "30 1 * * 6"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scorecard:
    name: Supply Chain - OpenSSF Scorecard (Optional)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Run OpenSSF Scorecard
        id: scorecard
        continue-on-error: true
        uses: ossf/scorecard-action@4eaacf0543bb3f2c246792bd56e8cdeffafb205a # v2.4.3
        with:
          results_file: scorecard-results.json
          results_format: json
          publish_results: false

      - name: Create human-readable summary
        if: always()
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          source = Path("scorecard-results.json")
          report = Path("scorecard-summary.md")

          if not source.is_file():
              report.write_text(
                  "# OpenSSF Scorecard Summary\n\n"
                  "> Scorecard did not produce a JSON result. Review the workflow log.\n"
              )
          else:
              data = json.loads(source.read_text())
              repository = data.get("repo", {}).get("name", "unknown")
              commit = data.get("repo", {}).get("commit", "unknown")
              score = data.get("score", "not available")
              checks = sorted(data.get("checks", []), key=lambda item: (item.get("score", -1), item.get("name", "")))

              lines = [
                  "# OpenSSF Scorecard Summary",
                  "",
                  f"- **Repository:** `{repository}`",
                  f"- **Commit:** `{commit}`",
                  f"- **Aggregate score:** **{score}/10**",
                  "",
                  "> The aggregate score is informational. Review individual checks and evidence before making a decision.",
                  "",
                  "| Check | Score | Result |",
                  "| --- | ---: | --- |",
              ]
              for check in checks:
                  name = str(check.get("name", "unknown")).replace("|", "\\|")
                  check_score = check.get("score", "N/A")
                  reason = str(check.get("reason", "No reason provided")).replace("|", "\\|").replace("\n", " ")
                  lines.append(f"| {name} | {check_score} | {reason} |")

              report.write_text("\n".join(lines) + "\n")
          PY

          cat scorecard-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Scorecard results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openssf-scorecard-results
          path: |
            scorecard-results.json
            scorecard-summary.md
          if-no-files-found: warn
          retention-days: 7

      - name: Report experiment status
        if: always()
        env:
          SCORECARD_OUTCOME: ${{ steps.scorecard.outcome }}
        run: |
          echo "OpenSSF Scorecard outcome: $SCORECARD_OUTCOME"
          echo "This experiment is informational and does not block deployment."
          echo "Review individual checks; do not gate on the aggregate score."
